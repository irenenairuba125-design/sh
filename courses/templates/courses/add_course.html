{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card p-4">
      <h1 class="mb-4">Add a course</h1>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
            {{ field.errors }}
          </div>
        {% endfor %}
        <button class="btn btn-teal">Create Course</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
